# Parlons géorgien — HTTPS vhost for parlonsgeorgien.fr
# Enable after certbot has issued the certificate for apex and www.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName parlonsgeorgien.fr
    ServerAlias www.parlonsgeorgien.fr

    ErrorLog  ${APACHE_LOG_DIR}/parlonsgeorgien.fr-ssl.error.log
    CustomLog ${APACHE_LOG_DIR}/parlonsgeorgien.fr-ssl.access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/parlonsgeorgien.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/parlonsgeorgien.fr/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.parlonsgeorgien\.fr$ [NC]
    RewriteRule ^/(.*)$ https://parlonsgeorgien.fr/$1 [R=301,L,NE]

    # Parlons géorgien is served from the domain root; do not set X-Forwarded-Prefix.
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
</IfModule>
