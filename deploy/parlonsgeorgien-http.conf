# Parlons géorgien — HTTP vhost for parlonsgeorgien.fr
# Install as /etc/apache2/sites-available/parlonsgeorgien.fr.conf after DNS points here.
<VirtualHost *:80>
    ServerName parlonsgeorgien.fr
    ServerAlias www.parlonsgeorgien.fr

    ErrorLog  ${APACHE_LOG_DIR}/parlonsgeorgien.fr.error.log
    CustomLog ${APACHE_LOG_DIR}/parlonsgeorgien.fr.access.log combined

    ProxyPreserveHost On

    # Keep HTTP-01 validation available before and after enabling HTTPS.
    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory /var/lib/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTP_HOST} ^www\.parlonsgeorgien\.fr$ [NC]
    RewriteRule ^/(.*)$ https://parlonsgeorgien.fr/$1 [R=301,L,NE]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://parlonsgeorgien.fr%{REQUEST_URI} [R=301,L,NE]

    # Parlons géorgien is served from the domain root; do not set X-Forwarded-Prefix.
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
